[metadata]
name = tropycal
version = 1.4
description = Package for retrieving and analyzing tropical cyclone data
long_description = file: README.md
long_description_content_type = text/markdown
author = Tomer Burg, Sam Lillo
platform = any
keywords = meteorology, weather
classifiers =
    Programming Language :: Python
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Intended Audience :: Science/Research
    Operating System :: OS Independent
url = https://github.com/tropycal/tropycal
project_urls =
    Documentation = https://tropycal.github.io/tropycal/
    Source Code = https://github.com/tropycal/tropycal

[options]
package_dir =
    = src
packages = find:
include_package_data = True
setup_requires = setuptools_scm
python_requires = >=3.8
install_requires =
    matplotlib>=3.3.2
    numpy>=1.18.0
    scipy>=1.5.0
    xarray>=0.16.0
    pandas>=1.3.0
    networkx>=2.5.0
    requests>=2.22.0
    pyshp>=2.1

[options.packages.find]
where = src
